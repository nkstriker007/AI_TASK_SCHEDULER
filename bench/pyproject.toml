[project]
name = "ats-bench"
version = "0.1.0"
description = "AI Task Scheduler benchmarks: workload generator, simulator sweeps, distributed runs (E1-E3), plots"
requires-python = ">=3.11"
dependencies = [
    "ats-planner",
    "ats-worker",
    "matplotlib>=3.8",
    "redis>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
ats-planner = { path = "../planner", editable = true }
ats-worker = { path = "../worker", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
