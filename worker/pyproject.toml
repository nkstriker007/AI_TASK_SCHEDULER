[project]
name = "ats-worker"
version = "0.1.0"
description = "AI Task Scheduler worker: consumes task streams, runs executors, commits results, emits events"
requires-python = ">=3.11"
dependencies = [
    "ats-planner",
    "redis>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
ats-planner = { path = "../planner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
