# Day 3: Redis 7, atsd (the C++ scheduler), the API and 3 workers.
#
#   docker compose up -d --build                     # redis + atsd + api (port 8000) + 3 workers
#   docker compose up -d --scale worker=5            # change the number of workers
#   docker compose logs -f atsd worker
#   docker compose down                              # stop (add -v to drop the Redis data volume)
#
# SIM_TIME_SCALE shrinks every sim task's duration (0.1 runs a 65 s plan in 6.5 s), e.g.
#   SIM_TIME_SCALE=0.1 docker compose up -d
# Real Groq tasks instead of sim (needs GROQ_API_KEY in .env):
#   ATSD_CAPABILITY=llm WORKER_CAPABILITIES=llm docker compose up -d      (or: make up-llm)
# Results over 64 KB are spilled to ./artifacts, shared by the workers and the API.
# atsd writes its event log to ./runs/<run_id>/events.jsonl.
#
# minisched (profile) is the Python stand-in used before atsd existed. It consumes requests:new
# like atsd does, so never run both:
#   docker compose --profile minisched up -d --scale atsd=0
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]  # streams and results survive a restart
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  atsd:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      ATSD_CAPABILITY: ${ATSD_CAPABILITY:-sim}   # must match the workers' WORKER_CAPABILITIES
      ATSD_LLM_MAX_INFLIGHT: ${ATSD_LLM_MAX_INFLIGHT:-8}
      ATSD_MAX_ATTEMPTS: ${ATSD_MAX_ATTEMPTS:-3}
      ATSD_POLICY: ${ATSD_POLICY:-fair-share}     # fair-share | critical-path | fifo (D41)
      ATSD_DRAIN_MS: ${ATSD_DRAIN_MS:-30000}      # on stop, wait this long for attempts in flight (D43)
      ATSD_SIM_TIMEOUT_MS: ${ATSD_SIM_TIMEOUT_MS:-300000}
      ATSD_LLM_TIMEOUT_MS: ${ATSD_LLM_TIMEOUT_MS:-120000}
      ATSD_RUNS_DIR: /runs
    volumes:
      - ./runs:/runs
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 40s   # longer than ATSD_DRAIN_MS, so Docker does not kill a draining atsd
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      ATS_PLANNER: ${ATS_PLANNER:-groq}
      ATS_ARTIFACTS_DIR: /artifacts
      ATS_FAST_PATH: ${ATS_FAST_PATH:-1}          # simple requests answered with one call (D58); 0 = off
    volumes:
      - ./artifacts:/artifacts
    env_file:
      - path: .env          # GROQ_API_KEY, ATS_PLANNER_MODEL, ATS_EXECUTOR_MODEL
        required: false
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CAPABILITIES: ${WORKER_CAPABILITIES:-sim}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      SIM_TIME_SCALE: ${SIM_TIME_SCALE:-1}
      ATS_ARTIFACTS_DIR: /artifacts
      # Fault injection for sim tasks (worker/faults.py); empty = off. Used by `make chaos`.
      SIM_FAULT_ERROR_RATE: ${SIM_FAULT_ERROR_RATE:-}
      SIM_FAULT_RATE_LIMIT_RATE: ${SIM_FAULT_RATE_LIMIT_RATE:-}
      SIM_FAULT_HANG_RATE: ${SIM_FAULT_HANG_RATE:-}
      SIM_FAULT_CRASH_RATE: ${SIM_FAULT_CRASH_RATE:-}
      SIM_FAULT_STRAGGLER_RATE: ${SIM_FAULT_STRAGGLER_RATE:-}
      SIM_FAULTS: ${SIM_FAULTS:-}
      SIM_FAULT_SEED: ${SIM_FAULT_SEED:-0}
      ATS_INPUT_BUDGET_CHARS: ${ATS_INPUT_BUDGET_CHARS:-6000}   # dependency results per task (D58); 0 = no limit
    env_file:
      # GROQ_API_KEY, ATS_EXECUTOR_MODEL, ATS_EXECUTOR_MODELS (llm workers only). ATS_EXECUTOR_MODELS is
      # set here, not above: unset means the per-type defaults (D58), while "" turns them off.
      - path: .env
        required: false
    volumes:
      - ./artifacts:/artifacts
    deploy:
      replicas: 3
    stop_grace_period: 2m   # let in-flight attempts finish on SIGTERM
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  minisched:
    profiles: ["minisched"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["python", "-m", "worker.minisched", "--serve"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
