[project]
name = "ats-planner"
version = "0.1.0"
description = "AI Task Scheduler planner: ExecutionPlan schema, validator, and LLM planner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "groq>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
