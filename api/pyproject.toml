[project]
name = "ats-api"
version = "0.1.0"
description = "AI Task Scheduler API: plan and submit requests, serve status and final output"
requires-python = ">=3.11"
dependencies = [
    "ats-planner",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.uv.sources]
ats-planner = { path = "../planner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
