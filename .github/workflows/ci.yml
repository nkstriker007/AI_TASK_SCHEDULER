name: ci
on: [push, pull_request]
jobs:
  scheduler:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install hiredis (atsd)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y libhiredis-dev; else brew install hiredis; fi
      - name: Configure
        run: cmake -S scheduler -B scheduler/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build scheduler/build -j
      - name: Unit tests
        run: cd scheduler/build && ctest --output-on-failure
      - name: Parity (C++ and Python vs expected_validation.json)
        run: uv run --project planner python tests/parity.py

  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: cd planner && uv run pytest
      - name: Schema freshness and parity tests
        run: uv run --project planner pytest tests/test_parity.py

  worker-api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      ATS_TEST_REDIS_URL: redis://localhost:6379/15  # tests flush this database
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build atsd (for the end-to-end tests)
        run: |
          sudo apt-get update && sudo apt-get install -y libhiredis-dev
          cmake -S scheduler -B scheduler/build -DCMAKE_BUILD_TYPE=Release -DATS_BUILD_TESTS=OFF
          cmake --build scheduler/build -j --target atsd
      - name: Worker tests (worker/, incl. atsd end to end)
        run: cd worker && uv run pytest
      - name: API tests
        run: cd api && uv run pytest
      - name: Docker images build
        run: docker compose build
